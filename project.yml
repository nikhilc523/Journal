name: Sediment
options:
  bundleIdPrefix: com.nikhilc.sediment
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  # --- App dependencies (locked platform stack, see docs/product/02-build-plan.md) ---
  SQLiteData:
    url: https://github.com/pointfreeco/sqlite-data
    from: "1.10.0"
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.9.0"
  DSWaveformImage:
    url: https://github.com/dmrschmidt/DSWaveformImage
    from: "14.5.0"
  Pow:
    url: https://github.com/EmergeTools/Pow
    from: "0.3.1"
  Vortex:
    url: https://github.com/twostraws/Vortex
    from: "1.0.4"
  swift-markdown:
    url: https://github.com/apple/swift-markdown
    from: "0.8.0"
  # --- Test-only dependencies ---
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.19.4"
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    from: "0.10.3"

targets:
  Sediment:
    type: application
    platform: iOS
    sources:
      - path: Sediment/Sources
      - path: Sediment/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikhilc.sediment.Sediment
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: "1"
    info:
      # Single explicit source for the app's Info.plist (regenerated by
      # `xcodegen generate`, so it is git-ignored). Additional keys — usage
      # strings, entitlements — land in later stages as features need them.
      path: Sediment/Info.plist
      properties:
        CFBundleDisplayName: Sediment
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        CFBundleURLTypes:
          - CFBundleURLName: com.nikhilc.sediment.deeplink
            CFBundleURLSchemes: [sediment]
    dependencies:
      - package: SQLiteData
        product: SQLiteData
      - package: GRDB
        product: GRDB
      - package: DSWaveformImage
        product: DSWaveformImage
      - package: DSWaveformImage
        product: DSWaveformImageViews
      - package: Pow
        product: Pow
      - package: Vortex
        product: Vortex
      - package: swift-markdown
        product: Markdown

  SedimentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SedimentTests
    dependencies:
      - target: Sediment
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikhilc.sediment.SedimentTests
        GENERATE_INFOPLIST_FILE: YES

  SedimentSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SedimentSnapshotTests
    dependencies:
      - target: Sediment
      - package: SnapshotTesting
        product: SnapshotTesting
      - package: ViewInspector
        product: ViewInspector
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikhilc.sediment.SedimentSnapshotTests
        GENERATE_INFOPLIST_FILE: YES

  SedimentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SedimentUITests
    dependencies:
      - target: Sediment
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikhilc.sediment.SedimentUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Sediment:
    build:
      targets:
        Sediment: all
        SedimentTests: [test]
        SedimentSnapshotTests: [test]
        SedimentUITests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - Sediment
      targets:
        - SedimentTests
        - SedimentSnapshotTests
        - SedimentUITests
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
