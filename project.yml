name: Journal
options:
  bundleIdPrefix: com.nikhilc.journal
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  # --- App dependencies (locked platform stack, see docs/product/02-build-plan.md) ---
  SQLiteData:
    url: https://github.com/pointfreeco/sqlite-data
    from: "1.10.0"
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.9.0"
  DSWaveformImage:
    url: https://github.com/dmrschmidt/DSWaveformImage
    from: "14.5.0"
  Pow:
    url: https://github.com/EmergeTools/Pow
    from: "0.3.1"
  Vortex:
    url: https://github.com/twostraws/Vortex
    from: "1.0.4"
  swift-markdown:
    url: https://github.com/apple/swift-markdown
    from: "0.8.0"
  # --- Test-only dependencies ---
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.19.4"
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    from: "0.10.3"

targets:
  Journal:
    type: application
    platform: iOS
    sources:
      - path: Journal/Sources
      - path: Journal/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikhilc.journal.Journal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: "1"
    info:
      # Single explicit source for the app's Info.plist (regenerated by
      # `xcodegen generate`, so it is git-ignored). Additional keys — usage
      # strings, entitlements — land in later stages as features need them.
      path: Journal/Info.plist
      properties:
        CFBundleDisplayName: Journal
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        CFBundleURLTypes:
          - CFBundleURLName: com.nikhilc.journal.deeplink
            CFBundleURLSchemes: [journal]
    dependencies:
      - package: SQLiteData
        product: SQLiteData
      - package: GRDB
        product: GRDB
      - package: DSWaveformImage
        product: DSWaveformImage
      - package: DSWaveformImage
        product: DSWaveformImageViews
      - package: Pow
        product: Pow
      - package: Vortex
        product: Vortex
      - package: swift-markdown
        product: Markdown

  JournalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JournalTests
    dependencies:
      - target: Journal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikhilc.journal.JournalTests
        GENERATE_INFOPLIST_FILE: YES

  JournalSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JournalSnapshotTests
    dependencies:
      - target: Journal
      - package: SnapshotTesting
        product: SnapshotTesting
      - package: ViewInspector
        product: ViewInspector
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikhilc.journal.JournalSnapshotTests
        GENERATE_INFOPLIST_FILE: YES

  JournalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: JournalUITests
    dependencies:
      - target: Journal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikhilc.journal.JournalUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Journal:
    build:
      targets:
        Journal: all
        JournalTests: [test]
        JournalSnapshotTests: [test]
        JournalUITests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - Journal
      targets:
        - JournalTests
        - JournalSnapshotTests
        - JournalUITests
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
