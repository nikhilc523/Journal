name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-26
    env:
      SCHEME: Journal
      # Minimum line coverage (%) for the app target. Raised as real features land.
      COVERAGE_MIN: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Resolve iPhone 17 simulator
        run: |
          set -euo pipefail
          # `OS=latest`/`name=` destinations resolve unreliably when several iOS
          # runtimes are installed, so pin to a concrete UDID: the highest iOS
          # runtime that has an "iPhone 17" (keeps us on iOS 26 given Xcode 26).
          UDID=$(xcrun simctl list devices available --json | python3 -c '
import sys, json
data = json.load(sys.stdin)["devices"]
best_ver, best_udid = None, None
for runtime, devices in data.items():
    if "iOS" not in runtime:
        continue
    ver = tuple(int(p) for p in runtime.rsplit(".", 1)[-1].split("-")[-3:] if p.isdigit())
    for dev in devices:
        if dev.get("name") == "iPhone 17" and dev.get("isAvailable"):
            if best_ver is None or ver > best_ver:
                best_ver, best_udid = ver, dev["udid"]
print(best_udid or "")
')
          if [ -z "$UDID" ]; then
            echo "::error::No available 'iPhone 17' simulator found on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Resolved iPhone 17 simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          echo "SIM_ID=$UDID" >> "$GITHUB_ENV"

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Journal.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage YES \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Coverage gate
        if: success()
        run: |
          set -euo pipefail
          COVERAGE=$(xcrun xccov view --report --json TestResults.xcresult \
            | python3 -c "import sys, json; d=json.load(sys.stdin); print(round(d['lineCoverage']*100, 2))")
          echo "Line coverage: ${COVERAGE}%"
          echo "### Coverage: ${COVERAGE}% (min ${COVERAGE_MIN}%)" >> "$GITHUB_STEP_SUMMARY"
          MET=$(python3 -c "print(1 if float('${COVERAGE}') >= float('${COVERAGE_MIN}') else 0)")
          if [ "$MET" -ne 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below the ${COVERAGE_MIN}% gate."
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
